name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      # The pages are rendered from these, so a change to one is a change to
      # the site even when nothing under site/ moved.
      - SPEC.md
      - CST.md
      - conformance/README.md
      - conformance/RUNNER.md
      - brand/**
      - .github/workflows/site.yml
  workflow_dispatch:

# The deployment reads the repository and writes to Pages; it publishes nothing
# else and holds no secret of its own.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancelled half-way: a run that is already
# uploading is the one serving the site next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `pretest` builds, and the tests hold every fence on every page to the
      # markdown it was rendered from: a colouring that changed a character
      # fails the run rather than being deployed.
      - name: Build and check the site
        working-directory: site
        run: |
          npm ci
          npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
