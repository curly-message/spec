name: Conformance package publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'next cuts a prerelease under the next dist-tag; patch, minor and major cut a release under latest'
        required: true
        default: next
        type: choice
        options:
          - next
          - patch
          - minor
          - major

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      package: conformance
      packed: |
        RUNNER.md
        bin/conformance.js
        bin/manifest.js
        defects.json
        dist/index.js
        dist/index.d.ts
        fixtures/grammar.json
        index.json
        schema/defect.schema.json
        schema/fixture.schema.json

  publish:
    needs: tests
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      package: conformance
      release: ${{ inputs.release }}
      # The set itself, as the release carries it for an implementation in a
      # language npm does not reach: the fixtures and what reads them, the
      # defect catalogue a runner is audited against, and the two documents
      # that state what both are.
      assets: |
        README.md
        RUNNER.md
        defects.json
        fixtures
        index.json
        schema/defect.schema.json
        schema/fixture.schema.json
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
