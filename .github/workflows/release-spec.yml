name: Specification release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The revision to cut, as major.minor.patch; the major is the version of the format'
        required: true
        type: string

jobs:
  # The set holds every section a fixture cites to a heading of the document,
  # which is the one check a revision has.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      package: conformance
      packed: |
        bin/conformance.js
        bin/manifest.js
        dist/index.js
        dist/index.d.ts
        fixtures/grammar.json
        index.json
        schema/fixture.schema.json

  release:
    needs: tests
    runs-on: ubuntu-latest
    concurrency: release-spec
    permissions:
      contents: read

    steps:
      - name: Refuse anything but main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::A revision is cut from main only, not from $GITHUB_REF_NAME."; exit 1; }

      # The release commit, its tag and the GitHub release are the app's: its
      # token passes the rules on main, and unlike the workflow's own token, a
      # push made with it starts the workflows that watch the branch.
      - name: Mint the release token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      # A document has no manifest to bump, so the revision is given by hand and
      # read back against what the document declares itself to be. The
      # changelog's Unreleased section becomes the revision's, so a release
      # without one fails.
      - name: Name the revision
        id: revision
        env:
          VERSION: ${{ inputs.version }}
        run: |
          grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' <<< "$VERSION" || { echo "::error::'$VERSION' is not a major.minor.patch revision."; exit 1; }
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already tagged."
            exit 1
          fi
          format=$(sed -n 's/^| Versioned identifier | `curly-message-\([0-9]\{1,\}\)` |$/\1/p' SPEC.md)
          [ -n "$format" ] || { echo "::error::SPEC.md names no versioned identifier to read v$VERSION against."; exit 1; }
          [ "${VERSION%%.*}" = "$format" ] || { echo "::error::SPEC.md specifies curly-message-$format; v$VERSION would name version ${VERSION%%.*} of the format."; exit 1; }
          grep -qx '## Unreleased' CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## Unreleased' section to release as $VERSION."; exit 1; }
          sed -i "s/^## Unreleased$/## $VERSION/" CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One atomic push carries the commit and the tag: either both land or
      # neither, and --follow-tags would have left a lightweight tag behind.
      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          id=$(gh api "/users/$APP[bot]" --jq .id)
          git config user.name "$APP[bot]"
          git config user.email "$id+$APP[bot]@users.noreply.github.com"
          git commit --all --message "chore: release the specification as $VERSION"
          git tag --annotate --message "Curly Message Format $VERSION" "v$VERSION"
          git push --atomic origin main "v$VERSION"

      # The release notes are the changelog section the revision just named.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "Curly Message Format $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
