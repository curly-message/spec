name: Specification release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The revision to cut, as major.minor.patch; the major is the version of the format'
        required: true
        type: string

jobs:
  # The set holds every section a fixture cites to a heading of the document,
  # which is the one check a revision has.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      package: conformance
      packed: |
        bin/conformance.js
        bin/manifest.js
        dist/index.js
        dist/index.d.ts
        fixtures/grammar.json
        index.json
        schema/fixture.schema.json

  release:
    needs: tests
    runs-on: ubuntu-latest
    environment: release
    concurrency: release-spec
    permissions:
      contents: read

    steps:
      - name: Refuse anything but main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::A revision is cut from main only, not from $GITHUB_REF_NAME."; exit 1; }

      # The release commit, its tag and the GitHub release are the app's: its
      # token passes the rules on main, and unlike the workflow's own token, a
      # push made with it starts the workflows that watch the branch.
      - name: Mint the release token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      # A document has no manifest to bump, so the revision is given by hand and
      # read back against what the document declares itself to be and against
      # the revision the changelog's pending section names: a revision is
      # settled in the commit that writes the section rather than in the
      # dispatch, and the two must agree. That section becomes the revision's,
      # so a release without one fails.
      - name: Name the revision
        id: revision
        env:
          VERSION: ${{ inputs.version }}
        run: |
          grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' <<< "$VERSION" || { echo "::error::'$VERSION' is not a major.minor.patch revision."; exit 1; }
          format=$(sed -n 's/^| Versioned identifier | `curly-message-\([0-9]\{1,\}\)` |$/\1/p' SPEC.md)
          [ -n "$format" ] || { echo "::error::SPEC.md names no versioned identifier to read v$VERSION against."; exit 1; }
          [ "${VERSION%%.*}" = "$format" ] || { echo "::error::SPEC.md specifies curly-message-$format; v$VERSION would name version ${VERSION%%.*} of the format."; exit 1; }
          # One spelling of the heading, read by the gate, by the revision it
          # names and by the rewrite: a widening one of them missed would pass
          # one and not the others.
          heading='### ([0-9]+\.[0-9]+\.[0-9]+) \(Unreleased\)'
          sections=$(grep -cE "^$heading$" CHANGELOG.md) || sections=0
          # The release commit closes the section, so a revision tagged
          # already reads none: its run is what finishes it.
          if [ "$sections" = 0 ] && [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "::error::v$VERSION is tagged already. Where its release stopped, re-run the failed jobs of the run that tagged it."
            exit 1
          fi
          [ "$sections" = 1 ] || { echo "::error::CHANGELOG.md holds $sections sections headed '### <major.minor.patch> (Unreleased)'; a revision reads exactly one."; exit 1; }
          declared=$(sed -nE "s/^$heading$/\1/p" CHANGELOG.md)
          [ "$declared" = "$VERSION" ] || { echo "::error::CHANGELOG.md's pending section names $declared, and this run was dispatched as $VERSION. Release what the section names, or rewrite its heading."; exit 1; }
          sed -i -E "s/^$heading$/## \1/" CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One atomic push carries the commit and the tag: either both land or
      # neither, and --follow-tags would have left a lightweight tag behind.
      # Where the tag is on origin already, a re-run of this job finishes the
      # release it names: the commit made here holds the tagged tree, and the
      # steps after this one run on the tagged commit with nothing pushed.
      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          id=$(gh api "/users/$APP[bot]" --jq .id)
          git config user.name "$APP[bot]"
          git config user.email "$id+$APP[bot]@users.noreply.github.com"
          git commit --all --message "chore: release the specification as $VERSION"
          prefix=v
          tag="$prefix$VERSION"
          tags=$(git ls-remote --tags origin "refs/tags/$prefix*")
          versions=$(sed -n "s|^[0-9a-f]*[[:space:]]refs/tags/$prefix\([^^]*\)$|\1|p" <<< "$tags")
          if ! grep -qxF "$VERSION" <<< "$versions"; then
            git tag --annotate --message "Curly Message Format $VERSION" "$tag"
            git push --atomic origin main "$tag"
          else
            git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            [ "$(git rev-parse "$tag^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ] || { echo "::error::$tag holds another release than the one this run commits."; exit 1; }
            # A stable release is held to the stable releases alone, and a
            # prerelease to every release. A `~` makes sort -V read a
            # prerelease before its release.
            compared=$versions
            case "$VERSION" in *-*|*rc*) ;; *) compared=$(sed -E '/-|rc/d' <<< "$versions") ;; esac
            newest=$({ echo "$compared"; echo "$VERSION"; } | sed -E 's/-|rc/~&/' | sort -V | tail -n 1)
            [ "${newest//\~/}" = "$VERSION" ] || { echo "::error::$prefix${newest//\~/} is tagged after $tag, and a release is finished before the next one is released."; exit 1; }
            git reset --soft "$tag^{commit}"
            echo "::notice::$tag holds this release already, so the run finishes it from there and pushes nothing."
          fi

      # The release notes are the changelog section the revision just named. A
      # published release passes.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.revision.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! release=$(gh release view "$tag" --json isDraft 2> "$RUNNER_TEMP/release.err"); then
            grep -qx 'release not found' "$RUNNER_TEMP/release.err" || { cat "$RUNNER_TEMP/release.err" >&2; exit 1; }
          fi
          if [ -n "$release" ]; then
            [ "$(jq -r .isDraft <<< "$release")" = false ] || { echo "::error::The GitHub release $tag is a draft, which this workflow does not leave: publish or delete it, then re-run."; exit 1; }
            echo "::notice::The GitHub release $tag is published already."
            exit 0
          fi
          awk -v heading="## $VERSION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --verify-tag --title "Curly Message Format $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
