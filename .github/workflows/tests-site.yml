name: Site tests

on:
  # A pull request from a fork pushes nothing here, so the tests run on the
  # pull request, whatever its base, which tests a stacked one too. main is
  # not watched: the Site workflow runs the same tests there before it
  # deploys. A branch with no pull request runs by hand.
  pull_request:
    paths:
      - site/**
      # The pages are rendered from these, so a change to one changes what the
      # tests hold the pages to, even when nothing under site/ moved.
      - SPEC.md
      - CST.md
      - conformance/README.md
      - conformance/RUNNER.md
      - brand/**
      - .github/workflows/tests-site.yml
  workflow_dispatch:

jobs:
  Tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # One environment, and the one the site is built in: the pages are
      # written by this build alone, so there is no second host to agree with.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `pretest` builds, and the tests hold every fence on every page to the
      # markdown it was rendered from.
      - name: Test
        run: npm test
