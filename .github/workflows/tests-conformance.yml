name: Conformance package tests

on:
  # A pull request from a fork pushes nothing here, so the tests run on the
  # pull request, whatever its base, which tests a stacked one too. A rebase
  # merge and a release commit land commits no pull request ran, so main is
  # tested again on a push. A tag is left out: it names a tree the publish
  # workflow has just tested. A branch with no pull request runs by hand.
  push:
    branches: [main]
    paths: &paths
      - conformance/**
      # The fixtures cite sections of the two documents the set reads against,
      # and the package's tests check that every citation still names a
      # heading.
      - SPEC.md
      - CST.md
      - .github/workflows/tests-conformance.yml
      - .github/workflows/tests.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      package: conformance
      packed: |
        bin/conformance.js
        bin/manifest.js
        dist/index.js
        dist/index.d.ts
        fixtures/grammar.json
        index.json
        schema/fixture.schema.json
